name: Build HTML with API Keys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Replaces the placeholders in the published copy only (never committed back).
      #   script.js        : __GROQ_API_KEY__, __OPENROUTER_API_KEY__   (Lumie chatbot)
      #   tarot/config.js  : __TAROT_API_KEY_1__, __TAROT_API_KEY_2__   (tarot house Oracle, tried in order)
      # A missing secret does not stop the deploy: the site falls back to free canned answers
      # (Lumie) or the basic reading (Tarot). The log below tells you exactly which are missing.
      - name: Inject API keys
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAROT_API_KEY_1: ${{ secrets.TAROT_API_KEY_1 }}
          TAROT_API_KEY_2: ${{ secrets.TAROT_API_KEY_2 }}
        run: |
          python3 - <<'PY'
          import os, sys
          jobs = {
            'script.js': ['GROQ_API_KEY', 'OPENROUTER_API_KEY'],
            'tarot/config.js': ['TAROT_API_KEY_1', 'TAROT_API_KEY_2'],
          }
          for path, names in jobs.items():
              text = open(path, encoding='utf-8').read()
              for n in names:
                  val = os.environ.get(n, '').strip()
                  token = '__' + n + '__'
                  if token not in text:
                      print(f'::error file={path}::placeholder {token} not found in {path}')
                      sys.exit(1)
                  text = text.replace(token, val)
                  if val:
                      print(f'OK       {n}: injected into {path} (length {len(val)})')
                  else:
                      print(f'::warning::{n} secret is EMPTY or missing - {path} will run without it')
              open(path, 'w', encoding='utf-8').write(text)
          PY

      - name: Verify no placeholder is left in the published files
        run: |
          if grep -n "__GROQ_API_KEY__\|__OPENROUTER_API_KEY__\|__TAROT_API_KEY_[12]__" script.js tarot/config.js; then
            echo "::error::A placeholder is still present"; exit 1
          fi
          echo "No placeholders left."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
