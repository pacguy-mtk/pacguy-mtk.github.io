name: Build HTML with API Key

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug - Check secret exists
        run: |
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "SECRET IS EMPTY OR MISSING"
            echo "Go to Settings > Secrets > Actions and add OPENROUTER_API_KEY"
            exit 1
          else
            echo "SECRET FOUND (length: ${#OPENROUTER_API_KEY} chars)"
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Inject API key into index.html
        run: |
          sed -i "s|__API_KEY__|${{ secrets.OPENROUTER_API_KEY }}|g" index.html
          echo "Placeholder replaced. Checking result..."
          grep -o "HUB_AI_API_KEY = \".*\"" index.html | head -c 30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
