name: Deploy Tarot TTS Worker

on:
  push:
    branches: [main]
    paths:
      - "tarot/gradium-tts-proxy/**"
      - ".github/workflows/deploy-tarot-tts-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarot-tts-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Cloudflare deployment credentials
        id: cloudflare-credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAROT_VAPI_KEY: ${{ secrets.TAROT_VAPI_KEY }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$TAROT_VAPI_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment credentials or TAROT_VAPI_KEY are missing; Worker deployment skipped."
          fi

      - name: Deploy Worker
        if: steps.cloudflare-credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tarot/gradium-tts-proxy
          secrets: |
            TAROT_VAPI_KEY
